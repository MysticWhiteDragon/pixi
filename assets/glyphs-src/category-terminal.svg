<!--
  The Terminal's glyph: a screen with a prompt cut out of it.

  The screen is one rounded body and the prompt is taken out of it, a ">" and
  a cursor bar, the same way the seam is cut from the toolbox in
  category-utilities.svg: the material finds air inside the body and beads a
  wall round each cut, so the prompt reads as a mark pressed into the glass
  rather than painted on. The chevron is stroked with round ends so it has no
  corners to catch light; the bar is as thick as the chevron's stroke so the
  two are one weight.

  lxb:shape — the material is computed from this outline. See
  category-games.svg, which is where it is explained.
-->

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <rect id="screen" x="3" y="6" width="26" height="20" rx="4"/>
    <g id="holes">
      <path d="M9.6 12.2L14.4 16L9.6 19.8" fill="none" stroke="#000000" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="16.4" y="18.5" width="6.4" height="2.3" rx="1.15" fill="#000000"/>
    </g>
    <mask id="pierced">
      <rect x="0" y="0" width="32" height="32" fill="#000000"/>
      <use href="#screen" fill="#ffffff"/>
      <use href="#holes"/>
    </mask>
  </defs>

  <g mask="url(#pierced)">
    <use href="#screen" fill="#ffffff"/>
  </g>
</svg>
