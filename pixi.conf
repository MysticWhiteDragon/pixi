# Pixi settings. install.sh copies this to ~/.config/pixi/pixi.conf.
# Lines starting with # are comments. Log out and back in after editing
# (Guide -> power button -> Log out). Theme, sounds and the confirm button can
# also be changed from Settings, which remembers them on its own.

[general]
# Accent color: purple, blue, green, yellow, red, teal, indigo, pink, orange.
theme = purple

# full   = LineXinBar's own look: a band of water, marks shaded like glass beads.
# simple = silk ribbons and flat marks, for slower machines.
# auto   = start with full, and switch to simple if frames take too long.
material = auto

# Which face button confirms: south (bottom) or east (right, the Japanese layout).
confirm_button = south

sounds = yes
clock_24h = yes

# How large everything is drawn. 0 picks a size for the screen (bigger on small
# screens like the PSPi's 800x480); 1.0 is LineXinBar's own scale.
ui_scale = 0

# Show command-line apps (Terminal=true desktop entries); they open in foot.
show_terminal_apps = no

# Desktop entries to hide, by file name.
hide = pixi.desktop,foot-server.desktop,footclient.desktop,org.codeberg.dnkl.foot-server.desktop,org.codeberg.dnkl.footclient.desktop


[display]
# Rotate the picture for a screen mounted sideways: 0, 90, 180 or 270.
rotate = 0


[retroarch]
binary = retroarch
# One folder per system under here: ~/roms/snes, ~/roms/gba, ...
rom_root = ~/roms
core_dirs = ~/.config/retroarch/cores,/usr/lib/aarch64-linux-gnu/libretro,/usr/lib/libretro


[input]
# Controllers SDL recognizes work automatically, including their Guide button.
# Select + Start pressed together opens the Guide on any controller.
# For a controller SDL doesn't recognize, these are its raw button numbers.
# Run "pixi-shell --debug-input --windowed 800x480" inside Pixi to see them.
joy_ok = 0
joy_back = 1
joy_menu = 3
joy_page_up = 4
joy_page_down = 5
joy_select = 6
joy_start = 7
joy_guide = 8


# Systems built in: nes snes gb gbc gba md sms gg pce psx psp nds n64.
# Override a field, or add a system:
#
# [system.arcade]
# name = Arcade
# dirs = arcade
# extensions = zip
# cores = fbneo,mame2003_plus

# Extra entries. category is one of: Games, Internet, Multimedia, Graphics,
# Office, Development, Education, Utilities, System, Other.
#
# [app.moonlight]
# name = Moonlight
# exec = moonlight-qt
# icon = moonlight
# category = Games
