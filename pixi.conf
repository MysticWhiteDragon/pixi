# Pixi settings. install.sh copies this to ~/.config/pixi/pixi.conf.
# Lines starting with # are comments. Log out and back in after editing
# (Guide -> power button -> Log out). Theme, sounds and the confirm button can
# also be changed from Settings, which remembers them on its own.

[general]
# Accent color (blue by default): purple, blue, green, yellow, red, teal, indigo, pink, orange.
theme = blue

# Which face button confirms: south (bottom) or east (right, the Japanese layout).
confirm_button = south

sounds = yes
clock_24h = yes
# Date in the corner: mdy (11/24), dmy (24/11), iso (2026-11-24), long (Tue Nov 24)
date_format = mdy
battery_percent = yes

# How large everything is drawn. 0 picks a size for the screen (bigger on small
# screens like the PSPi's 800x480); 1.0 is LineXinBar's own scale.
ui_scale = 0

# Show command-line apps (Terminal=true desktop entries); they open in Pixi's own terminal.
show_terminal_apps = no

# Desktop entries to hide, by file name.
hide = pixi.desktop,foot-server.desktop,footclient.desktop,org.codeberg.dnkl.foot-server.desktop,org.codeberg.dnkl.footclient.desktop


[display]
# Rotate the picture for a screen mounted sideways: 0, 90, 180 or 270.
rotate = 0


[retroarch]
binary = retroarch
# Console games: one folder per system under here: ~/Games/roms/snes, ~/Games/roms/gba, ...
rom_root = ~/Games/roms
# PC games: one folder per game, with its program inside: ~/Games/pc/Doom/doom
pc_root = ~/Games/pc
core_dirs = ~/.config/retroarch/cores,/usr/lib/aarch64-linux-gnu/libretro,/usr/lib/libretro


[input]
# Controllers SDL recognizes work automatically, including their Guide button.
# Select + Start pressed together opens the Guide on any controller.
# For a controller SDL doesn't recognize, these are its raw button numbers.
# Run "pixi-shell --debug-input --windowed 800x480" inside Pixi to see them.
joy_ok = 0
joy_back = 1
joy_menu = 2
joy_page_up = 4
joy_page_down = 5
joy_select = 8
joy_start = 9
joy_guide = 10
# The square (west) face button, used for the browser's tab list.
joy_square = 3
# Which browser engine the Web Browser app uses. Leave empty to find chromium or google-chrome automatically.
browser =
# The port for File transfer (FTP) in Settings. Ports above 1024 need no special rights.
ftp_port = 2121

# The port written into the web server's settings file the first time it starts (Settings > Servers > Web Server).
# After that the port is whatever ~/.config/pixi/nginx/nginx.conf says. Ports below 1024 work because install.sh lets
# normal users listen on ports from 80 up.
web_port = 80


[media]
# Pictures, Music and Videos look in ~/Pictures, ~/Music and ~/Videos, and in
# a Pictures (or DCIM), Music and Videos folder on any USB drive or card.
# Add other folders here, separated by commas.
# pictures = ~/Downloads/Photos
# music = /mnt/storage/Music
# videos = /mnt/storage/Movies
scan_removable = yes
# Videos play in Pixi's own player. D-pad left/right skip video_skip seconds, L and R skip
# video_skip_long seconds.
video_skip = 10
video_skip_long = 60
# VLC decodes the videos. no: in software (the default); auto: VLC may use the hardware decoder.
video_hwdec = no
# Only used if the built-in player can't start. VLC is installed by the installer.
video_player = cvlc --fullscreen --play-and-exit --no-video-title-show


# Systems built in: nes snes gb gbc gba md sms gg pce psx psp nds n64.
# Override a field, or add a system:
#
# [system.arcade]
# name = Arcade
# dirs = arcade
# extensions = zip
# cores = fbneo,mame2003_plus

# Extra entries. category is one of: Games, Internet, Multimedia, Graphics,
# Office, Development, Education, Utilities, System, Other.
#
# [app.moonlight]
# name = Moonlight
# exec = moonlight-qt
# icon = moonlight
# category = Games
